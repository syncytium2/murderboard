name: gates

# WHAT THIS IS FOR. This repo ships gates that other projects vendor and then
# trust. A gate that has silently stopped working is worse than no gate: it is
# installed, it is in a settings file, it reports nothing, and it manufactures
# exactly the confidence it was built to earn. That is not hypothetical here --
# the no-heredoc hook was live in several repos while failing OPEN on every
# call, because `python` did not exist on those machines and the hook took the
# missing interpreter as "nothing to check".
#
# So CI runs each gate's own --selftest, on BOTH platforms the gates actually
# run on. macOS is not redundant: the gates lean on grep/awk/sed, and BSD and
# GNU disagree often enough that "passes on Linux" is not the claim we need.
#
# Triggers are scoped to PRs and main so a private repo's macOS minutes (billed
# at 10x) are not spent on every push to every working branch.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Which is it? The no-heredoc bug turned on this exact difference, so
      # print it before anything runs rather than guessing from a failure later.
      - name: Report the interpreter situation
        run: |
          for c in python3 python py; do
            printf '%-8s %s\n' "$c" "$(command -v "$c" || echo '(absent)')"
          done
          printf 'grep     %s\n' "$(grep --version 2>&1 | head -1)"

      - name: roster gate --selftest
        run: bash murderboard_roster.sh --selftest

      - name: freshness gate --selftest
        run: bash murderboard_freshness.sh --selftest

      - name: commit-before-message gate --selftest
        run: bash require_commit_before_message.sh --selftest

      # The roster is DERIVED from doc_review_process.md by matching headings.
      # Reformat those headings and the roster quietly parses zero roles, at
      # which point every consumer's `check` passes vacuously. Catch it here.
      - name: roster parses the real process file
        run: |
          n=$(bash murderboard_roster.sh count)
          echo "roster parsed $n roles from doc_review_process.md"
          case "$n" in
            ''|*[!0-9]*) echo "::error::roster count is not a number: '$n'"; exit 1 ;;
          esac
          if [ "$n" -lt 1 ]; then
            echo "::error::roster parsed 0 roles — the process file's headings no longer match the parser"
            exit 1
          fi

      - name: no-heredoc hook, both modes
        run: bash tests/no_heredoc_hook_test.sh

      - name: portable prompt generator --selftest
        run: bash murderboard_prompt.sh --selftest

      # PROMPT.md is what a beginner copies out of the GitHub web UI without cloning
      # anything, so it must not drift from the generator. If this fails, someone
      # hand-edited it: regenerate, do not patch.
      - name: PROMPT.md matches its generator
        run: |
          extracted=$(sed -n '/^```$/,/^```$/p' PROMPT.md | sed '1d;$d')
          if ! diff <(printf '%s\n' "$extracted") <(bash murderboard_prompt.sh); then
            echo "::error::PROMPT.md is out of sync — regenerate with: bash murderboard_prompt.sh"
            exit 1
          fi
          echo "ok — PROMPT.md matches murderboard_prompt.sh"

  python:
    name: fetch_paper.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # the oldest a consumer is likely to drop it on

      - name: compiles
        run: python -m compileall -q fetch_paper.py

      # No network, no arguments that fetch anything.
      - name: --help runs on a bare interpreter
        run: python fetch_paper.py --help > /dev/null

      - name: stays stdlib-only
        run: python tests/fetch_paper_stdlib_test.py

      # Zenodo serves PDFs as application/octet-stream. If detection regresses to
      # trusting the declared mimetype, nothing raises — the paper is silently
      # saved as .txt and run through the HTML extractor, and the agent reads
      # something that is not the paper. Offline: pure function, literal inputs.
      - name: PDF detection survives a lying content-type
        run: python tests/fetch_paper_pdf_detect_test.py

      # `--promote <url> "name.pdf"` parsed the filename as a URL and dropped it: the
      # paper was filed under the cached title instead, silently, and the `--have`
      # search the promote/have protocol exists to serve then looked for a name that
      # was never written. Three doc strings in fetch_paper.py taught that form,
      # including the hint printed after a successful fetch. Offline: argparse only.
      - name: --promote refuses the form that silently discarded its filename
        run: python tests/fetch_paper_promote_args_test.py

      - name: revendor compiles
        run: python -m compileall -q murderboard_revendor.py

      # `subprocess.run(..., text=True)` with no `encoding=` decodes with the machine's
      # LOCALE codec -- UTF-8 here, cp1252 on a default Windows install. _git() is how
      # upstream FILE CONTENT arrives, and these files are full of em-dashes: cp1252
      # turns one into 'â€”' with no exception, so a Windows re-vendor lost the body
      # comparison, reported every file as drifted even under --check, and wrote the
      # mojibake back. Reported 2026-08-24. It cannot reproduce on any runner we have,
      # so the test FORCES a non-UTF-8 locale rather than hoping for one.
      - name: subprocess output decodes as UTF-8 on any locale
        run: python tests/subprocess_encoding_test.py

      # murderboard_revendor.py --example-config tells consumers what to vendor;
      # murderboard_freshness.sh's STAMPED_FILES is what the gate walks to notice drift.
      # A file in the first and not the second is copied everywhere and then never
      # checked -- silently, because the gate finds some other file and exits 0.
      # tools/murderboard_revendor.py was in that state from #29 until this test.
      - name: the two tools agree on the vendored set
        run: python tests/vendored_set_agrees_test.py

      # The stamp rewrite must stay surgical. Its --selftest includes NEGATIVE
      # CONTROLS: the whole-file substitution that corrupted a real vendored doc,
      # and the line-1-only version that silently skips every shebang file, must
      # both FAIL its fixtures. A fixture that cannot fail is what this tool was
      # written because of. Offline: pure functions, literal inputs.
      - name: revendor --selftest (the rewrite cannot spread)
        run: python murderboard_revendor.py --selftest

      # It ships in the vendored set, so it must run on the oldest interpreter a
      # consumer is likely to have, with no config present.
      - name: revendor --example-config is valid JSON
        run: python murderboard_revendor.py --example-config | python -c "import json,sys; json.load(sys.stdin)"

      # Runs daily in a scheduled workflow against a 14-day window that GitHub then
      # discards. A break is unrecoverable rather than merely annoying, so it is
      # checked here on every PR instead of being discovered a fortnight later.
      - name: the traffic archiver compiles and runs
        run: |
          python -m compileall -q .github/traffic_archive.py
          python .github/traffic_alert.py --help > /dev/null
          python -m compileall -q .github/traffic_alert.py
          python .github/traffic_archive.py --help > /dev/null

      # docs/index.html is served to the public by GitHub Pages. Its three
      # load-bearing properties all fail SILENTLY: drop the doctype and every
      # browser renders it in quirks mode (the gates table changes typeface, and
      # only in a browser); add a webfont and "renders the same air-gapped" --
      # which the page claims at its own top -- quietly becomes false; lose
      # docs/.nojekyll and Jekyll eats anything Liquid-shaped. None of that shows
      # up in a diff, so it gets a gate rather than a habit. The test carries its
      # own negative controls: eight mutations it must catch, checked every run.
      - name: the published page is still publishable
        run: python tests/published_page_test.py

  # ITS OWN JOB, AND THE NAME MATTERS. These steps used to live in the job called
  # `fetch_paper.py`, which has nothing to do with either of them: when the version gate
  # failed, the check a maintainer saw go red in the PR list was named after an unrelated
  # tool, and the first thing they had to work out was that the name was lying. A status
  # check that misdirects the person reading it is most of the way to being switched off.
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, DELIBERATELY. The version gate below compares against the base
      # commit, and a shallow checkout has no ancestry, so `git diff base...HEAD` cannot
      # find the merge base it requires and dies with `no merge base` / exit 128 -- before
      # comparing any versions at all. That was issue #48: it blocked a PR with an error
      # naming neither the plugin nor a version. It reproduced only in CI, because a local
      # clone has the full history, which is exactly why it survived review.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The plugin manifests are exercised ONLY on a stranger's machine, at install time,
      # after a push to main -- nothing here loads them, because a contributor working in
      # the checkout uses the files directly. Same invisible-locally shape as
      # docs/index.html, so it gets the same treatment. Three of the failures it catches
      # (the two manifests disagreeing on the version, a hook naming a script that moved,
      # the freshness gate losing the --plugin flag its own hook passes it) produce a
      # plugin that installs, reports success, and does nothing.
      - name: the plugin is still installable
        run: python tests/plugin_manifest_test.py

      # A FORGOTTEN VERSION BUMP IS A FALSE "CURRENT", which is the one verdict the
      # freshness gate promises never to produce. `claude plugin update` keys on the
      # version string: ship changed files under an unchanged version and nobody's update
      # does anything, while murderboard_freshness.sh --plugin compares the two equal
      # numbers and reports current. Both failures are silent and both land on strangers.
      #
      # IT RUNS ON PUSH TO MAIN AS WELL AS ON PRs. PR-only was itself a hole, and the
      # author fell straight through it: murderboard_freshness.sh was changed and merged
      # directly to main under an unchanged 0.1.0, so the gate built to prevent exactly
      # that never applied to the person who wrote it. On a push the base is the previous
      # tip, which for a merge commit covers everything the merge brought in.
      #
      # Scoped to the files that change plugin BEHAVIOUR. A README fix or a traffic-bot
      # commit ships in the tree too (source is "./") but changes nothing a user runs, and
      # demanding a release for those would train people to bump blindly.
      - name: the plugin version was bumped if the plugin changed
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi

          # A first push to a new branch reports an all-zero "before" and there is nothing
          # to compare against.
          case "$base" in
            ''|0000000000000000000000000000000000000000)
              echo "no base commit to compare against — nothing to check"; exit 0 ;;
          esac

          # REPORT, DO NOT CRASH. Without this the step dies inside `git diff` under
          # `bash -e` and the maintainer is told "no merge base", which says nothing about
          # plugin versions. The other gates in this repo all have a distinct
          # could-not-determine state; this is that state, and it fails CLOSED, because
          # the alternative is silently shipping an unbumped plugin.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::error::cannot see base commit $base, so the version check could not run."
            echo "::error::This is a CI history problem, not a plugin problem — the job needs"
            echo "::error::fetch-depth: 0. Nothing is known about whether a bump was needed."
            exit 1
          fi
          if ! git merge-base "$base" HEAD >/dev/null 2>&1; then
            echo "::error::no merge base between $base and HEAD, so the version check could"
            echo "::error::not run. This is a CI history problem, not a plugin problem."
            exit 1
          fi

          changed=$(git diff --name-only "$base"...HEAD -- \
                      skills hooks commands agents .claude-plugin \
                      doc_review_process.md fetch_paper.py \
                      'murderboard_*.sh' 'murderboard_*.py' \
                      require_commit_before_message.sh)
          if [ -z "$changed" ]; then
            echo "no change to the plugin payload — no bump required"
            exit 0
          fi
          echo "plugin payload changed:"; printf '  %s\n' $changed
          now=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          was=$(git show "$base:.claude-plugin/plugin.json" 2>/dev/null \
                | python -c "import json,sys;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")
          if [ -z "$was" ]; then
            echo "no plugin.json on the base commit — first introduction, nothing to bump against"
            exit 0
          fi
          if [ "$now" = "$was" ]; then
            echo "::error::the plugin payload changed but .claude-plugin/plugin.json is still $now."
            echo "::error::Installs key on this number: without a bump, /plugin update is a no-op"
            echo "::error::and the freshness gate compares two equal versions and says 'current'."
            echo "::error::Bump it (and marketplace.json, which must match)."
            exit 1
          fi
          echo "version bumped $was -> $now"

  lint:
    name: shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: syntax check every shell script
        run: |
          rc=0
          while IFS= read -r f; do
            if bash -n "$f"; then printf 'ok   %s\n' "$f"
            else printf 'FAIL %s\n' "$f"; rc=1; fi
          done < <(git ls-files '*.sh')
          exit $rc

      # ADVISORY ON PURPOSE. shellcheck has never been run against these files,
      # so making it blocking today would mean landing a red gate and learning
      # to ignore it -- the precise habit this repo exists to prevent. Read the
      # output, fix what is real, then delete this comment and the
      # continue-on-error line together.
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          git ls-files '*.sh' | xargs shellcheck --severity=warning || true
          git ls-files '*.sh' | xargs shellcheck --severity=error
